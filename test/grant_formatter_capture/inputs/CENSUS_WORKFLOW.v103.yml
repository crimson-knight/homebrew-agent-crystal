          if pins.is_symlink() or hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Exact provider source manifest before imports required")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact provider source before imports required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "launch.py"
          argv = [str(source), 'controls', "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--probe-packet", str(repo / "test/grant_native_buffer_probe"), "--feedback-packet", str(repo / "test/grant_native_buffer_source_feedback"),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest()]
          argv += ["--output", str(temporary / "unused-controls-output")]
          sys.argv = argv
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Install the ordinary formula through the installer
        id: ordinary_install
        timeout-minutes: 45
        run: |
          AGENT_CRYSTAL_FORMULA_PATH="$PWD/Formula/agent-crystal.rb" ./install.sh
          test "$(crystal-alpha eval 'puts 6 * 7')" = "42"
          brew test agent-crystal

      - name: Qualify the exact SDK in this job and seal its observed compiler
        id: sdk
        timeout-minutes: 15
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_GRANT_PACKET_SHA256"]
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Grant packet manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Grant packet source differs: " + row["path"])
          source = root / "qualify_same_job_sdk.py"
          sys.argv = [str(source), "--driver", str(pathlib.Path("test/sdk_install_qualification.py").resolve()),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Observe exact same-job native inputs before analysis-tool execution
        id: tool_admission
        timeout-minutes: 3
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['observe', '--root', '$TRANSFER_WORKSPACE', '--sdk-evidence', '$RUNNER_TEMP/grant-sdk-readiness', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Fetch independently pinned separate census decision
        id: census_review
        if: ${{ inputs.census_mode == 'execute' }}
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_native_provider").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_PROVIDER_PACKET_SHA256"]
          if pins.is_symlink() or hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Exact provider source manifest before imports required")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact provider source before imports required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "launch.py"
          argv = [str(source), 'fetch', "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--probe-packet", str(repo / "test/grant_native_buffer_probe"), "--feedback-packet", str(repo / "test/grant_native_buffer_source_feedback"),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest()]
          argv += ["--output", str(temporary / "census-review-decision"), "--decision-url", os.environ["ATLAS_CENSUS_DECISION_URL"], "--decision-sha256", os.environ["ATLAS_CENSUS_DECISION_SHA256"]]
          sys.argv = argv
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Observe or qualify separately admitted compiler census APIs
        id: census
        if: ${{ steps.tool_admission.outcome == 'success' && (inputs.census_mode == 'observe' || steps.census_review.outcome == 'success') }}
        timeout-minutes: 45
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          expected = os.environ["ATLAS_CENSUS_PACKET_SHA256"]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Exact census source manifest required before import")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Physical census executable source required")
              body = path.read_bytes()
              if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact census executable source required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          argv = [str(root / "launch_api.py"), os.environ["ATLAS_CENSUS_MODE"], "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--policies", str(temporary / "census-provider-policies"),
              "--packet-sha256", expected, "--output", str(temporary / "compiler-census-result")]
          if os.environ["ATLAS_CENSUS_MODE"] == "execute":
              argv += ["--decision", str(temporary / "census-review-decision/DECISION.json"), "--decision-sha256", os.environ["ATLAS_CENSUS_DECISION_SHA256"]]
          sys.argv = argv
          runpy.run_path(str(root / "launch_api.py"), run_name="__main__")
          PYTHON

      - name: Stage positive compiler census evidence
        id: census_stage
        if: ${{ always() && steps.census.outcome != 'skipped' }}
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          expected = os.environ["ATLAS_CENSUS_PACKET_SHA256"]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Exact census source manifest required before import")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Physical census executable source required")
              body = path.read_bytes()
              if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact census executable source required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          argv = [str(root / "launch_api.py"), "stage", "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--policies", str(temporary / "census-provider-policies"),
              "--packet-sha256", expected, "--output", str(temporary / "compiler-census-public")]
          sys.argv = [*argv, "--source", str(temporary / "compiler-census-result")]
          runpy.run_path(str(root / "launch_api.py"), run_name="__main__")
          PYTHON

      - name: Preserve positive compiler API proof and diagnostic evidence
        if: ${{ always() && steps.census_stage.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grant-compiler-census-api
          path: ${{ runner.temp }}/compiler-census-public
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30

      - name: Retire transferred tools after exact API-only consumer return
        id: cleanup
        if: ${{ always() && steps.transfer_start.outcome == 'success' }}
        timeout-minutes: 2
        env:
          CENSUS_ATTEMPTED: ${{ steps.census.outcome != 'skipped' }}
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          expected = os.environ["ATLAS_CENSUS_PACKET_SHA256"]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Exact API-only manifest required before every import")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Physical API-only execution source required")
              body = path.read_bytes()
              if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"] or stat.S_IMODE(path.stat().st_mode) != row["mode"]:
                  raise SystemExit("Exact API-only execution bytes/modes required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          common = ["--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--policies", str(temporary / "census-provider-policies"), "--packet-sha256", expected]
          def delegate(operation, extra):
              sys.argv = [str(root / "launch_api.py"), operation, *common, *extra]
              try:
                  runpy.run_path(sys.argv[0], run_name="__main__")
              except SystemExit as status:
                  if type(status.code) is not int or status.code != 0:
                      raise
          if os.environ.get("CENSUS_ATTEMPTED") == "true":
              extra = ["--output", str(temporary / "unused-api-return"), "--source", str(temporary / "compiler-census-result")]
              if os.environ["ATLAS_CENSUS_MODE"] == "execute":
                  extra += ["--decision", str(temporary / "census-review-decision/DECISION.json"), "--decision-sha256", os.environ["ATLAS_CENSUS_DECISION_SHA256"]]
              delegate("return", extra)
          delegate("cleanup", ["--output", str(temporary / "census-cleanup-result")])
          PYTHON

      - name: Stage the exact original tool retirement receipt
        id: cleanup_stage
        if: ${{ always() && steps.cleanup.outcome == 'success' }}
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          expected = os.environ["ATLAS_CENSUS_PACKET_SHA256"]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Exact API-only manifest required before every import")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Physical API-only execution source required")
              body = path.read_bytes()
              if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"] or stat.S_IMODE(path.stat().st_mode) != row["mode"]:
                  raise SystemExit("Exact API-only execution bytes/modes required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          common = ["--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--policies", str(temporary / "census-provider-policies"), "--packet-sha256", expected]
          def delegate(operation, extra):
              sys.argv = [str(root / "launch_api.py"), operation, *common, *extra]
              try:
                  runpy.run_path(sys.argv[0], run_name="__main__")
              except SystemExit as status:
                  if type(status.code) is not int or status.code != 0:
                      raise
          delegate("stage", ["--source", str(temporary / "census-cleanup-result"), "--output", str(temporary / "census-cleanup-public")])
          PYTHON

      - name: Preserve exact original transferred tool retirement
        if: ${{ always() && steps.cleanup_stage.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grant-census-tool-retirement
          path: ${{ runner.temp }}/census-cleanup-public
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30

      - name: Preserve exact same-job SDK evidence
        if: ${{ always() && steps.sdk.outcome != 'skipped' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grant-native-provider-sdk
          path: ${{ runner.temp }}/grant-sdk-readiness
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30
