name: Grant API-only provider observation and compiler census

on:
  workflow_dispatch:
    inputs:
      census_mode:
        type: choice
        options: [observe, execute]
        default: observe
        required: true
      census_decision_url:
        description: Immutable separately reviewed census scope decision URL
        type: string
        required: false
      census_decision_sha256:
        description: Independently selected census decision SHA-256
        type: string
        required: false

permissions:
  actions: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  PYTHONDONTWRITEBYTECODE: 1
  ATLAS_PROVIDER_PACKET_SHA256: 81823332a17911e16169d784da046ff4c9e5755aee4bb628724778cc5bc55693
  ATLAS_CENSUS_PACKET_SHA256: e15bc87f17bd03edb1d3ba6f1bd6db9cc2acaf94aca45f40d0c3f5c55fe1020e
  ATLAS_CENSUS_MODE: ${{ inputs.census_mode }}
  ATLAS_CENSUS_DECISION_URL: ${{ inputs.census_decision_url }}
  ATLAS_CENSUS_DECISION_SHA256: ${{ inputs.census_decision_sha256 }}
  ATLAS_GRANT_TRANSFER_SHA256: 439df1016cdfdfa237521eccf1f47f9fc72827a4990c3c35b2ec4d8371e4cd92
  ATLAS_GRANT_PACKET_SHA256: e186b50c45c15da64ede2801b41e1b05112222dd25cc969ca628c1a1007a8d0e

jobs:
  grant-dirty-transition-mac:
    name: Exact compiler API cards and concrete receiver proof
    runs-on: macos-26
    timeout-minutes: 148
    steps:
      - name: Check out reviewed tap source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878

      - name: Retain real pending-provider negative control
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              pins = root / filename
              if hashlib.sha256(pins.read_bytes()).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact externally reviewed manifest differs")
              for row in json.loads(pins.read_bytes())["files"]:
                  path = root / row["path"]
                  if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs: " + row["path"])
          source = root / "preflight_transferred_tools.py"
          sys.argv = [str(source), "--proof-tools", str(root / "PROOF_TOOLS_PENDING.json"), "--proof-tools-sha256", "7dc906cffee33465969acc8c00b6c65d5339cebe0506be5311831624a89e5893"]
          try:
              runpy.run_path(str(source), run_name="__main__")
          except SystemExit as error:
              if type(error.code) is not int or error.code != 2:
                  raise
          else:
              raise SystemExit("Pending proof registry unexpectedly admitted")
          PYTHON

      - name: Allocate fresh private finite tool transfer
        id: transfer_start
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['initialize', '--root', '$RUNNER_TEMP', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Transfer the exact independently reviewed preparation artifact
        id: tool_download
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '12310618101'
          repository: crimson-knight/homebrew-agent-crystal
          run-id: '39518892906'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ steps.transfer_start.outputs.workspace }}/download

      - name: Verify all37 artifact members and canonical tool source identities
        id: tool_transfer
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
          TRANSFER_CLOCK_SHA256: ${{ steps.transfer_start.outputs.clock_sha256 }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['transfer', '--root', '$TRANSFER_WORKSPACE', '--clock-sha256', '$TRANSFER_CLOCK_SHA256', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Exercise all original and installed provider source controls
        timeout-minutes: 3
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/census-fixture"
          ATLAS_FIXTURE_ROOT="$RUNNER_TEMP/census-fixture" TMPDIR="$RUNNER_TEMP/census-fixture" python3 -I -S -B - <<'CENSUS_CONTROLS'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["ATLAS_CENSUS_PACKET_SHA256"]:
              raise SystemExit("Exact census controls manifest required before imports")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact census control source required before import")
          for filename in ("test_census.py", "test_api_only.py"):
              sys.argv = [str(root / filename)]
              try:
                  runpy.run_path(sys.argv[0], run_name="__main__")
              except SystemExit as status:
                  if status.code is not False and not (type(status.code) is int and status.code == 0):
                      raise RuntimeError("Guarded source cohort must finish successfully") from status
          CENSUS_CONTROLS
          ATLAS_FIXTURE_ROOT="$RUNNER_TEMP/census-fixture" TMPDIR="$RUNNER_TEMP/census-fixture" python3 -O -I -S -B - <<'CENSUS_CONTROLS'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["ATLAS_CENSUS_PACKET_SHA256"]:
              raise SystemExit("Exact census controls manifest required before imports")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact census control source required before import")
          for filename in ("test_census.py", "test_api_only.py"):
              sys.argv = [str(root / filename)]
              try:
                  runpy.run_path(sys.argv[0], run_name="__main__")
              except SystemExit as status:
                  if status.code is not False and not (type(status.code) is int and status.code == 0):
                      raise RuntimeError("Guarded source cohort must finish successfully") from status
          CENSUS_CONTROLS
          ruby test/install_test.rb
          python3 -m unittest discover -s test -p 'test_sdk_*.py' -v
          python3 -I -S -B test/grant_dirty_transition/test_assignment_cost.py
          python3 -I -S -B test/grant_dirty_transition/test_same_job_policy.py
          python3 -I -S -B test/grant_dirty_transition/test_causal_only.py
          python3 -I -S -B test/grant_dirty_transition/test_timing_profile.py --workflow-fixture test/grant_dirty_transition/grant-causal-mac.proposed.yml
          python3 -O -I -S -B test/grant_dirty_transition/test_timing_profile.py --workflow-fixture test/grant_dirty_transition/grant-causal-mac.proposed.yml
          python3 -I -S -B test/grant_dirty_transition/test_workflow_layout.py --workflow-fixture test/grant_dirty_transition/grant-causal-mac.proposed.yml
          python3 -O -I -S -B test/grant_dirty_transition/test_workflow_layout.py --workflow-fixture test/grant_dirty_transition/grant-causal-mac.proposed.yml
          python3 -I -S -B test/grant_dirty_transition/test_dirty_transition.py
          python3 -O -I -S -B test/grant_dirty_transition/test_dirty_transition.py
          python3 -I -S -B test/grant_dirty_transition/test_dirty_prerequisites.py
          python3 -O -I -S -B test/grant_dirty_transition/test_dirty_prerequisites.py

          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['--artifact-directory', '$TRANSFER_WORKSPACE/download']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON
          python3 -O - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['--artifact-directory', '$TRANSFER_WORKSPACE/download']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_native_tool_roots.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in []]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON
          python3 -O - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_native_tool_roots.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in []]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_native_provider").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_PROVIDER_PACKET_SHA256"]
          if pins.is_symlink() or hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Exact provider source manifest before imports required")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact provider source before imports required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "launch.py"
          argv = [str(source), 'controls', "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--probe-packet", str(repo / "test/grant_native_buffer_probe"), "--feedback-packet", str(repo / "test/grant_native_buffer_source_feedback"),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest()]
          argv += ["--output", str(temporary / "unused-controls-output")]
          sys.argv = argv
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

          python3 -O -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
