name: Grant fixed carrier dirty transition diagnostic

on:
  workflow_dispatch:

permissions:
  actions: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  PYTHONDONTWRITEBYTECODE: 1
  ATLAS_GRANT_TRANSFER_SHA256: 23bf55f5c300618f1e07eb99e75e805b48516a18f6afb14192972b0f29a5a937
  ATLAS_GRANT_PACKET_SHA256: e186b50c45c15da64ede2801b41e1b05112222dd25cc969ca628c1a1007a8d0e

jobs:
  grant-dirty-transition-mac:
    name: One rich2 four arm diagnostic
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Check out reviewed tap source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878

      - name: Check source-only installer and SDK controls
        timeout-minutes: 3
        run: |
          ruby test/install_test.rb
          python3 -m unittest discover -s test -p 'test_sdk_*.py' -v
          python3 -I -S -B test/grant_dirty_transition/test_assignment_cost.py
          python3 -I -S -B test/grant_dirty_transition/test_same_job_policy.py
          python3 -I -S -B test/grant_dirty_transition/test_causal_only.py
          python3 -I -S -B test/grant_dirty_transition/test_timing_profile.py
          python3 -O -I -S -B test/grant_dirty_transition/test_timing_profile.py
          python3 -I -S -B test/grant_dirty_transition/test_workflow_layout.py
          python3 -O -I -S -B test/grant_dirty_transition/test_workflow_layout.py
          python3 -I -S -B test/grant_dirty_transition/test_dirty_transition.py
          python3 -O -I -S -B test/grant_dirty_transition/test_dirty_transition.py
          python3 -I -S -B test/grant_dirty_transition/test_dirty_prerequisites.py
          python3 -O -I -S -B test/grant_dirty_transition/test_dirty_prerequisites.py

      - name: Retain real pending-provider negative control
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              pins = root / filename
              if hashlib.sha256(pins.read_bytes()).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact externally reviewed manifest differs")
              for row in json.loads(pins.read_bytes())["files"]:
                  path = root / row["path"]
                  if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs: " + row["path"])
          source = root / "preflight_transferred_tools.py"
          sys.argv = [str(source), "--proof-tools", str(root / "PROOF_TOOLS_PENDING.json"), "--proof-tools-sha256", "7dc906cffee33465969acc8c00b6c65d5339cebe0506be5311831624a89e5893"]
          try:
              runpy.run_path(str(source), run_name="__main__")
          except SystemExit as error:
              if type(error.code) is not int or error.code != 2:
                  raise
          else:
              raise SystemExit("Pending proof registry unexpectedly admitted")
          PYTHON

      - name: Allocate fresh private finite tool transfer
        id: transfer_start
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['initialize', '--root', '$RUNNER_TEMP', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Transfer the exact independently reviewed preparation artifact
        id: tool_download
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '12310618101'
          repository: crimson-knight/homebrew-agent-crystal
          run-id: '39518892906'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ steps.transfer_start.outputs.workspace }}/download

      - name: Verify all37 artifact members and canonical tool source identities
        id: tool_transfer
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
          TRANSFER_CLOCK_SHA256: ${{ steps.transfer_start.outputs.clock_sha256 }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['transfer', '--root', '$TRANSFER_WORKSPACE', '--clock-sha256', '$TRANSFER_CLOCK_SHA256', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Exercise guarded transferred-source sensitivity controls
        timeout-minutes: 2
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['--artifact-directory', '$TRANSFER_WORKSPACE/download']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON
          python3 -O - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['--artifact-directory', '$TRANSFER_WORKSPACE/download']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Install the ordinary formula through the installer
        id: ordinary_install
        timeout-minutes: 45
        run: |
          AGENT_CRYSTAL_FORMULA_PATH="$PWD/Formula/agent-crystal.rb" ./install.sh
          test "$(crystal-alpha eval 'puts 6 * 7')" = "42"
          brew test agent-crystal

      - name: Qualify the exact SDK in this job and seal its observed compiler
        id: sdk
        timeout-minutes: 15
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_GRANT_PACKET_SHA256"]
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Grant packet manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Grant packet source differs: " + row["path"])
          source = root / "qualify_same_job_sdk.py"
          sys.argv = [str(source), "--driver", str(pathlib.Path("test/sdk_install_qualification.py").resolve()),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Observe exact same-job native inputs before analysis-tool execution
        id: tool_admission
        timeout-minutes: 3
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['observe', '--root', '$TRANSFER_WORKSPACE', '--sdk-evidence', '$RUNNER_TEMP/grant-sdk-readiness', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Prove APIs and run original comparison transition restored rich2 arms
        id: grant
        if: ${{ steps.tool_admission.outputs.execution_admitted == 'true' }}
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        timeout-minutes: 252
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_GRANT_PACKET_SHA256"]
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Grant packet manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Grant packet source differs: " + row["path"])
          # The guard preserves run_dirty_experiment.py through its separately pinned deadline successor.
          transfer_raw = (root / "TRANSFER_SOURCE_PINS.json").read_bytes()
          if hashlib.sha256(transfer_raw).hexdigest() != os.environ["ATLAS_GRANT_TRANSFER_SHA256"]:
              raise SystemExit("Exact transfer manifest differs")
          for row in json.loads(transfer_raw)["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact transfer source differs")
          source = root / "run_admitted_dirty.py"
          sys.argv = [str(source), "--driver", str(pathlib.Path("test/sdk_install_qualification.py").resolve()),
              "--sdk-evidence", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness"),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),
              "--time-sha256", hashlib.sha256(pathlib.Path("/usr/bin/time").read_bytes()).hexdigest(),
              "--timing-true-sha256", hashlib.sha256(pathlib.Path("/usr/bin/true").read_bytes()).hexdigest(),
              "--proof-tools", str(pathlib.Path(os.environ["TRANSFER_WORKSPACE"]) / "PROOF_TOOLS.json"), "--proof-tools-sha256", hashlib.sha256((pathlib.Path(os.environ["TRANSFER_WORKSPACE"]) / "PROOF_TOOLS.json").read_bytes()).hexdigest(),
              "--tool-workspace", os.environ["TRANSFER_WORKSPACE"], "--transfer-packet-sha256", os.environ["ATLAS_GRANT_TRANSFER_SHA256"],
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-dirty")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Snapshot the explicit result artifact roster
        id: result_stage
        if: ${{ always() && steps.grant.outcome != 'skipped' }}
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_GRANT_PACKET_SHA256"]
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Grant packet manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Grant packet source differs: " + row["path"])
          source = root / "stage_dirty_result_artifact.py"
          sys.argv = [str(source), "--source", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-dirty"),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-result-artifact")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Retire verified private tool payload after complete return
        if: ${{ always() && steps.transfer_start.outcome == 'success' }}
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['cleanup', '--root', '$TRANSFER_WORKSPACE', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Stage exact tool admission and return metadata
        id: tool_stage
        if: ${{ always() && steps.transfer_start.outcome == 'success' }}
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'stage_tool_admission.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['--source', '$TRANSFER_WORKSPACE', '--output', '$RUNNER_TEMP/grant-tool-admission-artifact', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Preserve positive analysis-tool admission metadata
        if: ${{ always() && steps.tool_stage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: grant-proof-tool-runtime-admission
          path: ${{ runner.temp }}/grant-tool-admission-artifact
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false

      - name: Preserve original SDK and same-job readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: grant-ordinary-mac-sdk-readiness
          path: ${{ runner.temp }}/grant-sdk-readiness
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false

      - name: Preserve diagnostic results and complete raw command output
        if: ${{ always() && steps.grant.outcome != 'skipped' && steps.result_stage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: grant-mac-rich2-fixed-carrier-dirty-diagnostic
          path: ${{ runner.temp }}/grant-result-artifact
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
