name: Grant native buffer ownership proof

on:
  workflow_dispatch:

permissions: {}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  PYTHONDONTWRITEBYTECODE: 1
  ATLAS_GRANT_PACKET_SHA256: 9dca430312103538460af4176fceef93f7744ea1e32572474f36ef73bbc25a09
  ATLAS_NATIVE_BUFFER_PACKET_SHA256: b870bfa171405927244d58b2ff676617c76de1f23f355bf9c86fd2a2a8b1b0cf
  ATLAS_NATIVE_BUFFER_POLICY: test/grant_native_buffer_probe/inputs/UNADMITTED_NATIVE_POLICY.json
  ATLAS_NATIVE_BUFFER_POLICY_SHA256: 7bffdfc9450462f6643cf25b9b10d70654b85970cbaa1ab2a133c96b69dc3fa2

jobs:
  grant-installed-mac:
    name: Native ownership mechanism with separate provider admission
    runs-on: macos-26
    timeout-minutes: 105
    steps:
      - name: Check out reviewed tap source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878

      - name: Check original installer and SDK source controls
        timeout-minutes: 3
        run: |
          ruby test/install_test.rb
          python3 -m unittest discover -s test -p 'test_sdk_*.py' -v

      - name: Install the ordinary formula through the installer
        id: ordinary_install
        timeout-minutes: 45
        run: |
          AGENT_CRYSTAL_FORMULA_PATH="$PWD/Formula/agent-crystal.rb" ./install.sh
          test "$(crystal-alpha eval 'puts 6 * 7')" = "42"
          brew test agent-crystal

      - name: Qualify the exact SDK in this job and seal its observed compiler
        id: sdk
        timeout-minutes: 15
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_assignment_cost").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_GRANT_PACKET_SHA256"]
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Grant packet manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Grant packet source differs: " + row["path"])
          source = root / "qualify_same_job_sdk.py"
          sys.argv = [str(source), "--driver", str(pathlib.Path("test/sdk_install_qualification.py").resolve()),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      # Admission prerequisite: the parent adds the separately reviewed tool/native
      # preflight here, bounded to900seconds, producing same-job source feedback.
      # Its absence preserves refusal before the native probe can execute.
      # The parent supplies independently reviewed same-job feedback and native policy.
      - name: Observe real native buffer ownership through exact wrapper arms
        id: native_buffer_probe
        timeout-minutes: 17
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_native_buffer_probe").resolve()
          expected = os.environ["ATLAS_NATIVE_BUFFER_PACKET_SHA256"]
          pins = root / "SOURCE_PINS.json"
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Native probe source manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"] or path.stat().st_mode & 0o777 != row["mode"]:
                  raise SystemExit("Native probe source differs: " + row["path"])
          python = pathlib.Path(sys.executable).resolve()
          python_sha = hashlib.sha256(python.read_bytes()).hexdigest()
          if python_sha != "1955899cb535256cfa477d926d016819e52e747984722c44f76e39a4950fee0e":
              raise SystemExit("Exact accepted hosted Python3.15.0 provider required")
          native_policy = pathlib.Path(os.environ["ATLAS_NATIVE_BUFFER_POLICY"]).resolve(strict=True)
          gates = pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-buffer-source-feedback" / "SOURCE_GATES.json"
          if not gates.exists():
              gates = root / "inputs/UNEXECUTED_SOURCE_GATES.json"
          source = root / "run_probe.py"
          sys.argv = [str(source), "--repository", str(pathlib.Path.cwd()),
              "--sdk-evidence", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness"),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-native-buffer-probe"),
              "--packet-sha256", expected, "--python-sha256", python_sha,
              "--native-policy", str(native_policy), "--native-policy-sha256", os.environ["ATLAS_NATIVE_BUFFER_POLICY_SHA256"],
              "--source-gates", str(gates), "--source-gates-sha256", hashlib.sha256(gates.read_bytes()).hexdigest()]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Stage positive native evidence and retained refusals
        id: native_buffer_stage
        if: ${{ always() && steps.native_buffer_probe.outcome != 'skipped' }}
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_native_buffer_probe").resolve()
          expected = os.environ["ATLAS_NATIVE_BUFFER_PACKET_SHA256"]
          pins = root / "SOURCE_PINS.json"
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Native stage source manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Native stage source differs")
          if hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest() != "1955899cb535256cfa477d926d016819e52e747984722c44f76e39a4950fee0e":
              raise SystemExit("Exact accepted hosted staging Python provider required")
          source = root / "stage_probe.py"
          sys.argv = [str(source), "--source", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-native-buffer-probe"),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-native-buffer-public"), "--packet-sha256", expected]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Upload finite native ownership evidence
        if: ${{ always() && steps.native_buffer_stage.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grant-native-buffer-ownership
          path: ${{ runner.temp }}/grant-native-buffer-public
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Upload same-job SDK evidence
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grant-native-buffer-sdk
          path: ${{ runner.temp }}/grant-sdk-readiness
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30
