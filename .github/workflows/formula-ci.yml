name: Formula CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  brew-install:
    name: "${{ matrix.os }} formula install"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test installer behavior with private commands
        timeout-minutes: 2
        run: ruby test/install_test.rb

      - name: Test SDK source and result validation
        timeout-minutes: 2
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s test -p 'test_sdk_*.py' -v

      - name: Exercise actual SDK original-group controls
        timeout-minutes: 1
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import platform
          import runpy
          import sys

          source = pathlib.Path("test/sdk_owned_group_controls.py").resolve()
          expected_source = "83bbb3a597462918e303be4b62e9bfbb6be4c8ac9b8d39734d0fdd0217a8c436"
          if hashlib.sha256(source.read_bytes()).hexdigest() != expected_source:
              raise SystemExit("Hosted control source SHA-256 mismatch")
          provider = pathlib.Path(sys.executable).resolve()
          sys.argv = [str(source),
              "--driver", "test/sdk_install_qualification.py",
              "--driver-sha256", "dfa1b22d9d2a534d70ed4c22494cf78e107d0ae40acae45b9f72a8970789a797",
              "--source-sha256", expected_source,
              "--python-sha256", hashlib.sha256(provider.read_bytes()).hexdigest(),
              "--python-version", platform.python_version(),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "sdk-owned-group-controls")]
          runpy.run_path(str(source), run_name="__main__")
          PY

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878

      - name: Register tap checkout
        run: brew tap --custom-remote crimson-knight/agent-crystal "$PWD"

      - name: Audit formula
        run: brew audit --strict --online crimson-knight/agent-crystal/agent-crystal

      - name: Install formula
        run: brew install --build-from-source crimson-knight/agent-crystal/agent-crystal

      - name: Smoke test commands
        run: |
          acrystal --version
          agent-crystal --version
          crystal-alpha --version
          test "$(acrystal eval 'puts 40 + 2')" = "42"
          test "$(crystal-alpha eval 'puts 40 + 2')" = "42"

      - name: Run formula tests
        run: brew test crimson-knight/agent-crystal/agent-crystal

      - name: Smoke test installer script
        run: |
          brew uninstall --force agent-crystal
          AGENT_CRYSTAL_FORMULA_PATH="$PWD/Formula/agent-crystal.rb" ./install.sh
          test "$(acrystal eval 'puts 6 * 7')" = "42"
          test "$(crystal-alpha eval 'puts 6 * 7')" = "42"

      - name: Exercise public SDK with the ordinary installed compiler
        timeout-minutes: 15
        run: PYTHONDONTWRITEBYTECODE=1 python3 test/sdk_install_qualification.py --output "$RUNNER_TEMP/sdk-readiness"

      - name: Preserve actual SDK results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sdk-readiness-${{ matrix.os }}
          path: ${{ runner.temp }}/sdk-readiness
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve actual original-group controls
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: sdk-owned-group-controls-${{ matrix.os }}
          path: ${{ runner.temp }}/sdk-owned-group-controls
          if-no-files-found: warn
          retention-days: 30
