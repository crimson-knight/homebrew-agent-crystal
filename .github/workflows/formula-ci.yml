name: Formula CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  brew-install:
    name: "${{ matrix.os }} formula install"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878

      - name: Register tap checkout
        run: brew tap --custom-remote crimson-knight/agent-crystal "$PWD"

      - name: Audit formula
        run: brew audit --strict --online crimson-knight/agent-crystal/agent-crystal

      - name: Install formula
        run: brew install --build-from-source crimson-knight/agent-crystal/agent-crystal

      - name: Smoke test commands
        run: |
          acrystal --version
          agent-crystal --version
          crystal-alpha --version
          test "$(acrystal eval 'puts 40 + 2')" = "42"
          test "$(crystal-alpha eval 'puts 40 + 2')" = "42"

      - name: Run formula tests
        run: brew test crimson-knight/agent-crystal/agent-crystal

      - name: Smoke test installer script
        run: |
          brew uninstall --force agent-crystal
          AGENT_CRYSTAL_FORMULA_PATH="$PWD/Formula/agent-crystal.rb" ./install.sh
          test "$(acrystal eval 'puts 6 * 7')" = "42"
          test "$(crystal-alpha eval 'puts 6 * 7')" = "42"
