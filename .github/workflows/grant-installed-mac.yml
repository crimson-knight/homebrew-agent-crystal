          argv += ["--output", str(temporary / "unused-cleanup-output"), "--source", str(temporary / "native-provider-public"), "--feedback-result", str(temporary / "native-buffer-source-feedback"), "--probe-result", str(temporary / "native-buffer-probe")]
          if os.environ.get("FEEDBACK_ATTEMPTED") == "true": argv += ["--feedback-attempted"]
          if os.environ.get("PROBE_ATTEMPTED") == "true": argv += ["--probe-attempted"]
