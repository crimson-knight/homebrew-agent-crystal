name: Grant hosted frontend six-route diagnostic
on:
  workflow_dispatch:
permissions: {}
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  PYTHONDONTWRITEBYTECODE: 1
  ATLAS_FRONTEND_PACKET_SHA256: df74f67b3484d64da6527438632c7a2e34dcec76769ac55f8e0c06561b08fb29
jobs:
  grant-installed-mac:
    runs-on: macos-26
    timeout-minutes: 90
    # Composed seconds: install2700/source180/SDK840/ladder900/stage120/uploads360/slack300.
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878
      - name: Validate complete source packet and guarded source controls
        timeout-minutes: 3
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,runpy,sys
          root=pathlib.Path('test/grant_frontend_hosted').resolve()
          pins=root/'SOURCE_PINS.json';raw=pins.read_bytes()
          if pins.is_symlink() or hashlib.sha256(raw).hexdigest()!=os.environ['ATLAS_FRONTEND_PACKET_SHA256']:raise SystemExit('Exact frontend manifest required')
          for row in json.loads(raw)['files']:
              path=root/row['path']
              if path.is_symlink() or path.resolve()!=path or path.stat().st_size!=row['bytes'] or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256'] or path.stat().st_mode&0o777!=row['mode']:raise SystemExit('Exact frontend source required')
          source=root/'bootstrap.py';sys.argv=[str(source),'test','--packet-sha256',os.environ['ATLAS_FRONTEND_PACKET_SHA256'],'--driver',str(pathlib.Path('test/sdk_install_qualification.py').resolve()),'--python-sha256',hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),'--output',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'frontend-source-controls'),'--public',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'frontend-source-controls-public')]
          runpy.run_path(str(source),run_name='__main__')
          PYTHON
          ruby test/install_test.rb
          python3 -m unittest discover -s test -p 'test_sdk_*.py' -v
      - name: Install and exercise ordinary formula
        timeout-minutes: 45
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,runpy,sys
          root=pathlib.Path('test/grant_frontend_hosted').resolve()
          pins=root/'SOURCE_PINS.json';raw=pins.read_bytes()
          if pins.is_symlink() or hashlib.sha256(raw).hexdigest()!=os.environ['ATLAS_FRONTEND_PACKET_SHA256']:raise SystemExit('Exact frontend manifest required')
          for row in json.loads(raw)['files']:
              path=root/row['path']
              if path.is_symlink() or path.resolve()!=path or path.stat().st_size!=row['bytes'] or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256'] or path.stat().st_mode&0o777!=row['mode']:raise SystemExit('Exact frontend source required')
          source=root/'bootstrap.py';sys.argv=[str(source),'verify','--packet-sha256',os.environ['ATLAS_FRONTEND_PACKET_SHA256']]
          runpy.run_path(str(source),run_name='__main__')
          PYTHON
          AGENT_CRYSTAL_FORMULA_PATH="$PWD/Formula/agent-crystal.rb" ./install.sh
          test "$(crystal-alpha eval 'puts 6 * 7')" = "42"
          brew test agent-crystal
      - name: Seal actual same-job SDK and compiler
        id: sdk
        timeout-minutes: 15
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,runpy,sys
          root=pathlib.Path('test/grant_frontend_hosted').resolve()
          pins=root/'SOURCE_PINS.json';raw=pins.read_bytes()
          if pins.is_symlink() or hashlib.sha256(raw).hexdigest()!=os.environ['ATLAS_FRONTEND_PACKET_SHA256']:raise SystemExit('Exact frontend manifest required')
          for row in json.loads(raw)['files']:
              path=root/row['path']
              if path.is_symlink() or path.resolve()!=path or path.stat().st_size!=row['bytes'] or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256'] or path.stat().st_mode&0o777!=row['mode']:raise SystemExit('Exact frontend source required')
          source=root/'bootstrap.py';sys.argv=[str(source),'sdk','--packet-sha256',os.environ['ATLAS_FRONTEND_PACKET_SHA256'],'--driver',str(pathlib.Path('test/sdk_install_qualification.py').resolve()),'--python-sha256',hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),'--output',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'frontend-sdk-readiness')]
          runpy.run_path(str(source),run_name='__main__')
          PYTHON
      - name: Measure exact semantic-only source ladder
        id: frontend
        timeout-minutes: 17
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,runpy,sys
          root=pathlib.Path('test/grant_frontend_hosted').resolve()
          pins=root/'SOURCE_PINS.json';raw=pins.read_bytes()
          if pins.is_symlink() or hashlib.sha256(raw).hexdigest()!=os.environ['ATLAS_FRONTEND_PACKET_SHA256']:raise SystemExit('Exact frontend manifest required')
          for row in json.loads(raw)['files']:
              path=root/row['path']
              if path.is_symlink() or path.resolve()!=path or path.stat().st_size!=row['bytes'] or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256'] or path.stat().st_mode&0o777!=row['mode']:raise SystemExit('Exact frontend source required')
          source=root/'bootstrap.py';sys.argv=[str(source),'run','--packet-sha256',os.environ['ATLAS_FRONTEND_PACKET_SHA256'],'--repository',str(pathlib.Path.cwd()),'--driver',str(pathlib.Path('test/sdk_install_qualification.py').resolve()),'--python-sha256',hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),'--ps-sha256',hashlib.sha256(pathlib.Path('/bin/ps').read_bytes()).hexdigest(),'--sdk-evidence',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'frontend-sdk-readiness'),'--output',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'frontend-six-result')]
          runpy.run_path(str(source),run_name='__main__')
          PYTHON
      - name: Stage exact bounded public evidence
        id: result_stage
        if: always() && steps.frontend.outcome != 'skipped'
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib,runpy,sys
          root=pathlib.Path('test/grant_frontend_hosted').resolve()
          pins=root/'SOURCE_PINS.json';raw=pins.read_bytes()
          if pins.is_symlink() or hashlib.sha256(raw).hexdigest()!=os.environ['ATLAS_FRONTEND_PACKET_SHA256']:raise SystemExit('Exact frontend manifest required')
          for row in json.loads(raw)['files']:
              path=root/row['path']
              if path.is_symlink() or path.resolve()!=path or path.stat().st_size!=row['bytes'] or hashlib.sha256(path.read_bytes()).hexdigest()!=row['sha256'] or path.stat().st_mode&0o777!=row['mode']:raise SystemExit('Exact frontend source required')
          source=root/'bootstrap.py';sys.argv=[str(source),'stage','--packet-sha256',os.environ['ATLAS_FRONTEND_PACKET_SHA256'],'--source',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'frontend-six-result'),'--output',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'frontend-public-evidence')]
          runpy.run_path(str(source),run_name='__main__')
          PYTHON
      - name: Upload fixed frontend evidence
        if: always() && steps.result_stage.outcome == 'success'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grant-frontend-six-macos
          path: ${{ runner.temp }}/frontend-public-evidence/
          include-hidden-files: false
          if-no-files-found: error
      - name: Upload exact SDK readiness evidence
        if: always() && steps.sdk.outcome != 'skipped'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-sdk-readiness-macos
          path: ${{ runner.temp }}/frontend-sdk-readiness/
          include-hidden-files: false
          if-no-files-found: error
      - name: Upload fixed source-control evidence
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-source-controls-macos
          path: ${{ runner.temp }}/frontend-source-controls-public/
          include-hidden-files: false
          if-no-files-found: error
