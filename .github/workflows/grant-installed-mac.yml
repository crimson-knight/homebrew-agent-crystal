      - name: Install the exact diagnostic formula through the explicit source override
        id: ordinary_install
        timeout-minutes: 45
        run: |
          AGENT_CRYSTAL_FORMULA_PATH="$PWD/Formula/agent-crystal.rb" ./install.sh
          test "$(crystal-alpha eval 'puts 6 * 7')" = "42"
          brew test agent-crystal

      - name: Qualify the exact SDK in this job and seal its observed compiler
        id: sdk
        timeout-minutes: 15
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, stat
          for folder, variable, count in (("grant_assignment_cost", "ATLAS_GRANT_PACKET_SHA256", 215), ("grant_cache_policy", "ATLAS_CACHE_PACKET_SHA256", None)):
              base = pathlib.Path("test") / folder
              pins = base / "SOURCE_PINS.json"
              def regular(path):
                  for parent in (path.parent, *path.parent.parents):
                      if parent == pathlib.Path('.'):
                          break
                      if not stat.S_ISDIR(parent.lstat().st_mode):
                          raise SystemExit("Physical source directory required")
                  before = path.lstat()
                  if not stat.S_ISREG(before.st_mode) or before.st_size > 8 * 2**20:
                      raise SystemExit("Bounded ordinary source file required")
                  with path.open('rb') as stream:
                      value = stream.read(8 * 2**20 + 1)
                  after = path.lstat()
                  fields = lambda item: (item.st_dev, item.st_ino, item.st_mode, item.st_size, item.st_mtime_ns, item.st_ctime_ns)
                  if fields(before) != fields(after) or len(value) != before.st_size:
                      raise SystemExit("Stable complete source member required")
                  return value
              raw_pins = regular(pins)
              if hashlib.sha256(raw_pins).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact source manifest differs: " + folder)
              rows = json.loads(raw_pins)["files"]
              if (count is not None and len(rows) != count) or not 1 <= len(rows) <= 256 or len({row['path'] for row in rows}) != len(rows):
                  raise SystemExit("Complete unique source roster required")
              for row in rows:
                  relative = pathlib.PurePosixPath(row['path'])
                  if relative.is_absolute() or '..' in relative.parts or str(relative) != row['path']:
                      raise SystemExit("Contained source member required")
                  value = regular(base / relative)
                  if type(row['bytes']) is not int or len(value) != row['bytes'] or hashlib.sha256(value).hexdigest() != row['sha256']:
                      raise SystemExit("Exact source member differs: " + folder + "/" + row['path'])
          import runpy, sys
          root = pathlib.Path("test/grant_assignment_cost").resolve()
          expected = os.environ["ATLAS_GRANT_PACKET_SHA256"]
          source = root / "qualify_same_job_sdk.py"
          sys.argv = [str(source), "--driver", str(pathlib.Path("test/sdk_install_qualification.py").resolve()),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Run one cold default disabled restored cache triplet
        id: grant
        timeout-minutes: 82
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, stat
          for folder, variable, count in (("grant_assignment_cost", "ATLAS_GRANT_PACKET_SHA256", 215), ("grant_cache_policy", "ATLAS_CACHE_PACKET_SHA256", None)):
              base = pathlib.Path("test") / folder
              pins = base / "SOURCE_PINS.json"
              def regular(path):
                  for parent in (path.parent, *path.parent.parents):
                      if parent == pathlib.Path('.'):
                          break
                      if not stat.S_ISDIR(parent.lstat().st_mode):
                          raise SystemExit("Physical source directory required")
                  before = path.lstat()
                  if not stat.S_ISREG(before.st_mode) or before.st_size > 8 * 2**20:
                      raise SystemExit("Bounded ordinary source file required")
                  with path.open('rb') as stream:
                      value = stream.read(8 * 2**20 + 1)
                  after = path.lstat()
                  fields = lambda item: (item.st_dev, item.st_ino, item.st_mode, item.st_size, item.st_mtime_ns, item.st_ctime_ns)
                  if fields(before) != fields(after) or len(value) != before.st_size:
                      raise SystemExit("Stable complete source member required")
                  return value
              raw_pins = regular(pins)
              if hashlib.sha256(raw_pins).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact source manifest differs: " + folder)
              rows = json.loads(raw_pins)["files"]
              if (count is not None and len(rows) != count) or not 1 <= len(rows) <= 256 or len({row['path'] for row in rows}) != len(rows):
                  raise SystemExit("Complete unique source roster required")
              for row in rows:
                  relative = pathlib.PurePosixPath(row['path'])
                  if relative.is_absolute() or '..' in relative.parts or str(relative) != row['path']:
                      raise SystemExit("Contained source member required")
                  value = regular(base / relative)
                  if type(row['bytes']) is not int or len(value) != row['bytes'] or hashlib.sha256(value).hexdigest() != row['sha256']:
                      raise SystemExit("Exact source member differs: " + folder + "/" + row['path'])
          import runpy, sys
          root = pathlib.Path("test/grant_cache_policy").resolve()
          expected = os.environ["ATLAS_CACHE_PACKET_SHA256"]
          source = root / "run_cache_policy.py"
          sys.path.insert(0, str(root))
          sys.argv = [str(source), "--driver", str(pathlib.Path("test/sdk_install_qualification.py").resolve()),
              "--sdk-evidence", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness"),
              "--cache-packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),
              "--time-sha256", hashlib.sha256(pathlib.Path("/usr/bin/time").read_bytes()).hexdigest(),
              "--timing-true-sha256", hashlib.sha256(pathlib.Path("/usr/bin/true").read_bytes()).hexdigest(),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-cache")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Snapshot the explicit returned cache result roster
        id: result_stage
        if: ${{ always() && steps.grant.outcome != 'skipped' }}
        timeout-minutes: 2
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, stat
          for folder, variable, count in (("grant_assignment_cost", "ATLAS_GRANT_PACKET_SHA256", 215), ("grant_cache_policy", "ATLAS_CACHE_PACKET_SHA256", None)):
              base = pathlib.Path("test") / folder
              pins = base / "SOURCE_PINS.json"
              def regular(path):
                  for parent in (path.parent, *path.parent.parents):
                      if parent == pathlib.Path('.'):
                          break
                      if not stat.S_ISDIR(parent.lstat().st_mode):
                          raise SystemExit("Physical source directory required")
                  before = path.lstat()
                  if not stat.S_ISREG(before.st_mode) or before.st_size > 8 * 2**20:
                      raise SystemExit("Bounded ordinary source file required")
                  with path.open('rb') as stream:
                      value = stream.read(8 * 2**20 + 1)
                  after = path.lstat()
                  fields = lambda item: (item.st_dev, item.st_ino, item.st_mode, item.st_size, item.st_mtime_ns, item.st_ctime_ns)
                  if fields(before) != fields(after) or len(value) != before.st_size:
                      raise SystemExit("Stable complete source member required")
                  return value
              raw_pins = regular(pins)
              if hashlib.sha256(raw_pins).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact source manifest differs: " + folder)
              rows = json.loads(raw_pins)["files"]
              if (count is not None and len(rows) != count) or not 1 <= len(rows) <= 256 or len({row['path'] for row in rows}) != len(rows):
                  raise SystemExit("Complete unique source roster required")
              for row in rows:
                  relative = pathlib.PurePosixPath(row['path'])
                  if relative.is_absolute() or '..' in relative.parts or str(relative) != row['path']:
                      raise SystemExit("Contained source member required")
                  value = regular(base / relative)
                  if type(row['bytes']) is not int or len(value) != row['bytes'] or hashlib.sha256(value).hexdigest() != row['sha256']:
                      raise SystemExit("Exact source member differs: " + folder + "/" + row['path'])
          import runpy, sys
          root = pathlib.Path("test/grant_cache_policy").resolve()
          expected = os.environ["ATLAS_CACHE_PACKET_SHA256"]
          source = root / "stage_cache_results.py"
          sys.path.insert(0, str(root))
          sys.argv = [str(source), "--source", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-cache"),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-cache-result-artifact")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Preserve original SDK and same-job readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grant-ordinary-mac-sdk-readiness
          path: ${{ runner.temp }}/grant-sdk-readiness
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false

      - name: Preserve diagnostic results and complete raw command output
        if: ${{ always() && steps.grant.outcome != 'skipped' && steps.result_stage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grant-mac-rich10-cold-cache-diagnostic
          path: ${{ runner.temp }}/grant-cache-result-artifact
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
