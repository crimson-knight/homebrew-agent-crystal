name: Grant proof-tool preparation

on:
  workflow_dispatch:

permissions: {}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  PYTHONDONTWRITEBYTECODE: 1
  ATLAS_GRANT_PACKET_SHA256: 9dca430312103538460af4176fceef93f7744ea1e32572474f36ef73bbc25a09
  ATLAS_BOOTSTRAP_PACKET_SHA256: 239dfd520deb496fbfa12db558e83cebbf0dac7b2d59e6ed25709e274e606bef

jobs:
  grant-installed-mac:
    name: Build returned tools for independent admission
    runs-on: macos-26
    timeout-minutes: 85
    steps:
      - name: Check out reviewed tap source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878

      - name: Check original installer and SDK source controls
        timeout-minutes: 3
        run: |
          ruby test/install_test.rb
          python3 -m unittest discover -s test -p 'test_sdk_*.py' -v

      - name: Install the ordinary formula through the installer
        id: ordinary_install
        timeout-minutes: 45
        run: |
          AGENT_CRYSTAL_FORMULA_PATH="$PWD/Formula/agent-crystal.rb" ./install.sh
          test "$(crystal-alpha eval 'puts 6 * 7')" = "42"
          brew test agent-crystal

      - name: Qualify the exact SDK in this job and seal its observed compiler
        id: sdk
        timeout-minutes: 15
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_assignment_cost").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_GRANT_PACKET_SHA256"]
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Grant packet manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Grant packet source differs: " + row["path"])
          source = root / "qualify_same_job_sdk.py"
          sys.argv = [str(source), "--driver", str(pathlib.Path("test/sdk_install_qualification.py").resolve()),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Build pinned Ameba and return tool identities
        id: bootstrap
        timeout-minutes: 15
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_tool_bootstrap").resolve()
          pins = root / "BOOTSTRAP_SOURCE_PINS.json"
          expected = os.environ["ATLAS_BOOTSTRAP_PACKET_SHA256"]
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Bootstrap source manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Bootstrap source differs: " + row["path"])
          candidates = []
          if os.environ.get("DEVELOPER_DIR"):
              candidates.append(pathlib.Path(os.environ["DEVELOPER_DIR"]) / "usr/bin/git")
          candidates.extend([pathlib.Path("/Applications/Xcode.app/Contents/Developer/usr/bin/git"), pathlib.Path("/opt/homebrew/opt/git/bin/git")])
          git = next((p.resolve(strict=True) for p in candidates if p.is_file()), None)
          if git is None or git == pathlib.Path("/usr/bin/git"):
              raise SystemExit("A resolved installed native Git backend is required")
          curl = pathlib.Path("/usr/bin/curl").resolve(strict=True)
          provider_sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          source = root / "bootstrap_tools.py"
          sys.argv = [str(source), "--repository", str(pathlib.Path.cwd()),
              "--sdk-evidence", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness"),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-proof-tools"),
              "--packet-sha256", expected, "--python-sha256", provider_sha(pathlib.Path(sys.executable).resolve()),
              "--curl", str(curl), "--curl-sha256", provider_sha(curl), "--git", str(git), "--git-sha256", provider_sha(git)]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Stage the positive returned-tool evidence roster
        id: result_stage
        if: ${{ always() && steps.bootstrap.outcome != 'skipped' }}
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_tool_bootstrap").resolve()
          pins = root / "BOOTSTRAP_SOURCE_PINS.json"
          expected = os.environ["ATLAS_BOOTSTRAP_PACKET_SHA256"]
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Bootstrap source manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Bootstrap source differs: " + row["path"])
          source = root / "stage_tools.py"
          sys.argv = [str(source), "--packet-sha256", expected,
              "--source", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-proof-tools"),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-proof-tools-public")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Preserve original SDK and same-job readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: grant-proof-tool-sdk-readiness
          path: ${{ runner.temp }}/grant-sdk-readiness
          if-no-files-found: warn
          retention-days: 30
          include-hidden-files: false

      - name: Preserve returned tools and positive preparation evidence
        if: ${{ always() && steps.bootstrap.outcome != 'skipped' && steps.result_stage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: grant-proof-tools-unadmitted
          path: ${{ runner.temp }}/grant-proof-tools-public
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: false
