name: Experimental census provider metadata and compiler census

on:
  workflow_dispatch:
    inputs:
      qualification_mode:
        description: Experimental source route; full behavior qualification remains separate
        required: true
        default: provider-static
        type: choice
        options: [provider-static, census]
      static_admission_json:
        description: Independently reviewed finite zero-calibration admission JSON
        required: false
        type: string
      static_admission_sha256:
        description: Independently selected admission SHA-256
        required: false
        type: string
      static_nonce:
        description: Externally selected fresh invocation nonce
        required: false
        type: string
      census_mode:
        type: choice
        options: [observe, execute]
        default: observe
        required: true
      census_decision_url:
        description: Immutable separately reviewed census scope decision URL
        type: string
        required: false
      census_decision_sha256:
        description: Independently selected census decision SHA-256
        type: string
        required: false

permissions:
  actions: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  PYTHONDONTWRITEBYTECODE: 1
  ATLAS_PROVIDER_PACKET_SHA256: 81823332a17911e16169d784da046ff4c9e5755aee4bb628724778cc5bc55693
  ATLAS_CENSUS_PACKET_SHA256: 8cfe4d4cf0e4648f36e1b3abfc0ac09d61930117bf6a6ab7938ba136e299cdc0
  ATLAS_CENSUS_MODE: ${{ inputs.census_mode }}
  ATLAS_CENSUS_DECISION_URL: ${{ inputs.census_decision_url }}
  ATLAS_CENSUS_DECISION_SHA256: ${{ inputs.census_decision_sha256 }}
  ATLAS_GRANT_TRANSFER_SHA256: 439df1016cdfdfa237521eccf1f47f9fc72827a4990c3c35b2ec4d8371e4cd92
  ATLAS_GRANT_PACKET_SHA256: e186b50c45c15da64ede2801b41e1b05112222dd25cc969ca628c1a1007a8d0e

jobs:
  census-provider-static:
    if: ${{ inputs.qualification_mode == 'provider-static' }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only static provider observation with finite original-group return
        timeout-minutes: 6
        env:
          STATIC_ADMISSION_JSON: ${{ inputs.static_admission_json }}
          STATIC_ADMISSION_SHA256: ${{ inputs.static_admission_sha256 }}
          STATIC_NONCE: ${{ inputs.static_nonce }}
        run: |
          python3 -I -S -B - <<'STATIC_PROVIDER'
          import hashlib, importlib.util, json, os, pathlib, sys, time
          root = pathlib.Path.cwd().resolve()
          python = pathlib.Path(sys.executable).resolve()
          if hashlib.sha256(python.read_bytes()).hexdigest() != '1955899cb535256cfa477d926d016819e52e747984722c44f76e39a4950fee0e':
              raise RuntimeError('Exact selected historical Python bootstrap required')
          source = root / 'test/grant_census_provider_static'
          raw = (source / 'SOURCE_PINS.json').read_bytes()
          if hashlib.sha256(raw).hexdigest() != 'b2f7d8e644a9188c3e954552b6a15a6f5e6447734a12714c589ebe32607570ab':
              raise RuntimeError('Exact static observer manifest required before imports')
          for row in json.loads(raw)['files']:
              path = root / row['path']
              if path.is_symlink() or path.resolve(strict=True) != path or len(path.read_bytes()) != row['bytes'] or hashlib.sha256(path.read_bytes()).hexdigest() != row['sha256']:
                  raise RuntimeError('Exact physical static observation source required')
          driver = root / 'test/sdk_install_qualification.py'
          if hashlib.sha256(driver.read_bytes()).hexdigest() != 'dfa1b22d9d2a534d70ed4c22494cf78e107d0ae40acae45b9f72a8970789a797':
              raise RuntimeError('Exact original Runner required')
          admission = os.environ['STATIC_ADMISSION_JSON'].encode()
          if hashlib.sha256(admission).hexdigest() != os.environ['STATIC_ADMISSION_SHA256']:
              raise RuntimeError('Exact selected static admission JSON bytes required')
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'census-static-provider-control'
          output.mkdir(mode=0o700)
          admission_path = output / 'ADMISSION.json'
          admission_path.write_bytes(admission)
          spec = importlib.util.spec_from_file_location('original_static_metadata_Runner', driver)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          helper_path = root / 'test/grant_compiler_census_api/vendor/public_bytes.py'
          if hashlib.sha256(helper_path.read_bytes()).hexdigest() != 'eacac63dddddb829c9f4dad67c948b0b4a6386e0365ac910c801a5b6f58312ed':
              raise RuntimeError('Exact original publication content policy required')
          helper_spec = importlib.util.spec_from_file_location('static_artifact_public_policy', helper_path)
          helper = importlib.util.module_from_spec(helper_spec)
          helper_spec.loader.exec_module(helper)
          runner = module.Runner(output)
          runner.deadline = time.monotonic() + 360
          try:
              runner.run('zero-calibration-provider', [str(python), '-I', '-S', '-B', str(source / 'observe_static.py'),
                  '--shared-root', str(root / 'test/grant_source_qualification_shared'), '--shared-manifest-sha256', '4be477796e248c7ca3a145e8733da0f2d8fbf2b3d5545ce4668a123e215b284f',
                  '--public-helper', str(root / 'test/grant_compiler_census_api/vendor/public_bytes.py'),
                  '--admission', str(admission_path), '--admission-sha256', os.environ['STATIC_ADMISSION_SHA256'],
                  '--nonce', os.environ['STATIC_NONCE'], '--output', str(output / 'metadata')], cwd=root, seconds=300)
          finally:
              returned = (json.dumps(dict(commands=runner.records, groups=runner.group_observations,
                  writers_confirmed_retired=runner.writers_confirmed_retired), sort_keys=True) + '\n').encode()
              helper.inspect_public_bytes('COMMAND_RETURN.json', returned)
              (output / 'COMMAND_RETURN.json').write_bytes(returned)
              if runner.writers_confirmed_retired:
                  for name in ['zero-calibration-provider.stdout.txt', 'zero-calibration-provider.stderr.txt']:
                      helper.inspect_public_bytes(name, (output / name).read_bytes())
              else:
                  raise RuntimeError('Retired writers required before public raw stream retention')
              for row in json.loads(raw)['files']:
                  if hashlib.sha256((root / row['path']).read_bytes()).hexdigest() != row['sha256']:
                      raise RuntimeError('Every original observer source returned exact')
              if hashlib.sha256(driver.read_bytes()).hexdigest() != 'dfa1b22d9d2a534d70ed4c22494cf78e107d0ae40acae45b9f72a8970789a797':
                  raise RuntimeError('Original Runner source returned exact')
              selected = []
              for name, path in [('OBSERVATION_RESULT.json', output / 'metadata/OBSERVATION_RESULT.json'),
                  ('STATIC_PROFILE.json', output / 'metadata/STATIC_PROFILE.json'), ('PUBLIC_STAGE.json', output / 'metadata/PUBLIC_STAGE.json'),
                  ('COMMAND_RETURN.json', output / 'COMMAND_RETURN.json'), ('zero-calibration-provider.stdout.txt', output / 'zero-calibration-provider.stdout.txt'),
                  ('zero-calibration-provider.stderr.txt', output / 'zero-calibration-provider.stderr.txt')]:
                  if path.exists():
                      if path.is_symlink() or not path.is_file() or path.resolve(strict=True) != path:
                          raise RuntimeError('Exact physical public metadata member required')
                      body = path.read_bytes()
                      helper.inspect_public_bytes(name, body)
                      selected.append((name, body))
              if sum(len(body) for name, body in selected) > 24 * 2**20:
                  raise RuntimeError('Complete24MiB public metadata ceiling required')
              public = output / 'public'
              public.mkdir(mode=0o700)
              for name, body in selected:
                  (public / name).write_bytes(body)
          if not runner.writers_confirmed_retired or any(g['status'] != 'absent' for g in runner.group_observations):
              raise RuntimeError('Complete original metadata group return required')
          STATIC_PROVIDER
      - name: Retain fixed value-free static metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 2
        with:
          name: census-zero-calibration-provider
          path: |
            ${{ runner.temp }}/census-static-provider-control/public/OBSERVATION_RESULT.json
            ${{ runner.temp }}/census-static-provider-control/public/STATIC_PROFILE.json
            ${{ runner.temp }}/census-static-provider-control/public/PUBLIC_STAGE.json
            ${{ runner.temp }}/census-static-provider-control/public/COMMAND_RETURN.json
            ${{ runner.temp }}/census-static-provider-control/public/zero-calibration-provider.stdout.txt
            ${{ runner.temp }}/census-static-provider-control/public/zero-calibration-provider.stderr.txt
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1
  grant-dirty-transition-mac:
    if: ${{ inputs.qualification_mode == 'census' }}
    name: Exact compiler API cards and concrete receiver proof
    runs-on: macos-26
    timeout-minutes: 151
    steps:
      - name: Check out reviewed tap source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878

      - name: Retain real pending-provider negative control
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              pins = root / filename
              if hashlib.sha256(pins.read_bytes()).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact externally reviewed manifest differs")
              for row in json.loads(pins.read_bytes())["files"]:
                  path = root / row["path"]
                  if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs: " + row["path"])
          source = root / "preflight_transferred_tools.py"
          sys.argv = [str(source), "--proof-tools", str(root / "PROOF_TOOLS_PENDING.json"), "--proof-tools-sha256", "7dc906cffee33465969acc8c00b6c65d5339cebe0506be5311831624a89e5893"]
          try:
              runpy.run_path(str(source), run_name="__main__")
          except SystemExit as error:
              if type(error.code) is not int or error.code != 2:
                  raise
          else:
              raise SystemExit("Pending proof registry unexpectedly admitted")
          PYTHON

      - name: Allocate fresh private finite tool transfer
        id: transfer_start
        timeout-minutes: 1
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['initialize', '--root', '$RUNNER_TEMP', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Transfer the exact independently reviewed preparation artifact
        id: tool_download
        timeout-minutes: 2
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: '12310618101'
          repository: crimson-knight/homebrew-agent-crystal
          run-id: '39518892906'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ steps.transfer_start.outputs.workspace }}/download

      - name: Verify all37 artifact members and canonical tool source identities
        id: tool_transfer
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
          TRANSFER_CLOCK_SHA256: ${{ steps.transfer_start.outputs.clock_sha256 }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['transfer', '--root', '$TRANSFER_WORKSPACE', '--clock-sha256', '$TRANSFER_CLOCK_SHA256', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Exercise all original and installed provider source controls
        timeout-minutes: 3
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          mkdir -p "$RUNNER_TEMP/census-fixture"
          ATLAS_FIXTURE_ROOT="$RUNNER_TEMP/census-fixture" TMPDIR="$RUNNER_TEMP/census-fixture" python3 -I -S -B - <<'CENSUS_CONTROLS'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["ATLAS_CENSUS_PACKET_SHA256"]:
              raise SystemExit("Exact census controls manifest required before imports")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact census control source required before import")
          for filename in ("test_census.py", "test_api_only.py", "test_v104.py", "test_v105.py"):
              sys.argv = [str(root / filename)]
              try:
                  runpy.run_path(sys.argv[0], run_name="__main__")
              except SystemExit as status:
                  if status.code is not False and not (type(status.code) is int and status.code == 0):
                      raise RuntimeError("Guarded source cohort must finish successfully") from status
          CENSUS_CONTROLS
          ATLAS_FIXTURE_ROOT="$RUNNER_TEMP/census-fixture" TMPDIR="$RUNNER_TEMP/census-fixture" python3 -O -I -S -B - <<'CENSUS_CONTROLS'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["ATLAS_CENSUS_PACKET_SHA256"]:
              raise SystemExit("Exact census controls manifest required before imports")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact census control source required before import")
          for filename in ("test_census.py", "test_api_only.py", "test_v104.py", "test_v105.py"):
              sys.argv = [str(root / filename)]
              try:
                  runpy.run_path(sys.argv[0], run_name="__main__")
              except SystemExit as status:
                  if status.code is not False and not (type(status.code) is int and status.code == 0):
                      raise RuntimeError("Guarded source cohort must finish successfully") from status
          CENSUS_CONTROLS
          ruby test/install_test.rb
          python3 -m unittest discover -s test -p 'test_sdk_*.py' -v
          python3 -I -S -B test/grant_dirty_transition/test_assignment_cost.py
          python3 -I -S -B test/grant_dirty_transition/test_same_job_policy.py
          python3 -I -S -B test/grant_dirty_transition/test_causal_only.py
          python3 -I -S -B test/grant_dirty_transition/test_timing_profile.py --workflow-fixture test/grant_dirty_transition/grant-causal-mac.proposed.yml
          python3 -O -I -S -B test/grant_dirty_transition/test_timing_profile.py --workflow-fixture test/grant_dirty_transition/grant-causal-mac.proposed.yml
          python3 -I -S -B test/grant_dirty_transition/test_workflow_layout.py --workflow-fixture test/grant_dirty_transition/grant-causal-mac.proposed.yml
          python3 -O -I -S -B test/grant_dirty_transition/test_workflow_layout.py --workflow-fixture test/grant_dirty_transition/grant-causal-mac.proposed.yml
          python3 -I -S -B test/grant_dirty_transition/test_dirty_transition.py
          python3 -O -I -S -B test/grant_dirty_transition/test_dirty_transition.py
          python3 -I -S -B test/grant_dirty_transition/test_dirty_prerequisites.py
          python3 -O -I -S -B test/grant_dirty_transition/test_dirty_prerequisites.py

          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['--artifact-directory', '$TRANSFER_WORKSPACE/download']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON
          python3 -O - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['--artifact-directory', '$TRANSFER_WORKSPACE/download']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_native_tool_roots.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in []]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON
          python3 -O - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'test_native_tool_roots.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in []]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_native_provider").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_PROVIDER_PACKET_SHA256"]
          if pins.is_symlink() or hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Exact provider source manifest before imports required")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact provider source before imports required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "launch.py"
          argv = [str(source), 'controls', "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--probe-packet", str(repo / "test/grant_native_buffer_probe"), "--feedback-packet", str(repo / "test/grant_native_buffer_source_feedback"),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest()]
          argv += ["--output", str(temporary / "unused-controls-output")]
          sys.argv = argv
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

          python3 -O -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_native_provider").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_PROVIDER_PACKET_SHA256"]
          if pins.is_symlink() or hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Exact provider source manifest before imports required")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact provider source before imports required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "launch.py"
          argv = [str(source), 'controls', "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--probe-packet", str(repo / "test/grant_native_buffer_probe"), "--feedback-packet", str(repo / "test/grant_native_buffer_source_feedback"),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest()]
          argv += ["--output", str(temporary / "unused-controls-output")]
          sys.argv = argv
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Install the ordinary formula through the installer
        id: ordinary_install
        timeout-minutes: 45
        run: |
          AGENT_CRYSTAL_FORMULA_PATH="$PWD/Formula/agent-crystal.rb" ./install.sh
          test "$(crystal-alpha eval 'puts 6 * 7')" = "42"
          brew test agent-crystal

      - name: Qualify the exact SDK in this job and seal its observed compiler
        id: sdk
        timeout-minutes: 15
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_GRANT_PACKET_SHA256"]
          if hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Grant packet manifest differs")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if path.is_symlink() or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Grant packet source differs: " + row["path"])
          source = root / "qualify_same_job_sdk.py"
          sys.argv = [str(source), "--driver", str(pathlib.Path("test/sdk_install_qualification.py").resolve()),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest(),
              "--output", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "grant-sdk-readiness")]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Observe exact same-job native inputs before analysis-tool execution
        id: tool_admission
        timeout-minutes: 3
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_dirty_transition").resolve()
          for filename, variable in (("SOURCE_PINS.json", "ATLAS_GRANT_PACKET_SHA256"), ("TRANSFER_SOURCE_PINS.json", "ATLAS_GRANT_TRANSFER_SHA256")):
              raw = (root / filename).read_bytes()
              if hashlib.sha256(raw).hexdigest() != os.environ[variable]:
                  raise SystemExit("Exact execution manifest differs")
              for row in json.loads(raw)["files"]:
                  path = root / row["path"]
                  if not stat.S_ISREG(path.lstat().st_mode):
                      raise SystemExit("Physical execution source required")
                  value = path.read_bytes()
                  if len(value) != row["bytes"] or hashlib.sha256(value).hexdigest() != row["sha256"]:
                      raise SystemExit("Exact execution source differs")
          source = root / 'proof_tool_transfer.py'
          sys.argv = [str(source), *[os.path.expandvars(value) for value in ['observe', '--root', '$TRANSFER_WORKSPACE', '--sdk-evidence', '$RUNNER_TEMP/grant-sdk-readiness', '--transfer-sha256', '$ATLAS_GRANT_TRANSFER_SHA256']]]
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Observe source-selected pkgconf and GC metadata before execution
        id: pkgconf_observation
        if: ${{ steps.tool_admission.outcome == 'success' }}
        timeout-minutes: 3
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          expected = os.environ["ATLAS_CENSUS_PACKET_SHA256"]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Exact census source manifest required before import")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Physical census executable source required")
              body = path.read_bytes()
              if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact census executable source required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          argv = [str(root / "launch_api.py"), "observe-pkgconf", "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--policies", str(temporary / "census-provider-policies"),
              "--packet-sha256", expected, "--output", str(temporary / "pkgconf-observation")]
          sys.argv = argv
          runpy.run_path(str(root / "launch_api.py"), run_name="__main__")
          PYTHON


      - name: Fetch independently pinned separate census decision
        id: census_review
        if: ${{ inputs.census_mode == 'execute' }}
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_native_provider").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_PROVIDER_PACKET_SHA256"]
          if pins.is_symlink() or hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Exact provider source manifest before imports required")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact provider source before imports required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "launch.py"
          argv = [str(source), 'fetch', "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--probe-packet", str(repo / "test/grant_native_buffer_probe"), "--feedback-packet", str(repo / "test/grant_native_buffer_source_feedback"),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest()]
          argv += ["--output", str(temporary / "census-review-decision"), "--decision-url", os.environ["ATLAS_CENSUS_DECISION_URL"], "--decision-sha256", os.environ["ATLAS_CENSUS_DECISION_SHA256"]]
          sys.argv = argv
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Observe or qualify separately admitted compiler census APIs
        id: census
        if: ${{ always() && steps.tool_admission.outcome == 'success' && (steps.pkgconf_observation.outcome == 'failure' || inputs.census_mode == 'observe' || steps.census_review.outcome == 'success') }}
        timeout-minutes: 45
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          expected = os.environ["ATLAS_CENSUS_PACKET_SHA256"]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Exact census source manifest required before import")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Physical census executable source required")
              body = path.read_bytes()
              if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact census executable source required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          argv = [str(root / "launch_api.py"), os.environ["ATLAS_CENSUS_MODE"], "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--policies", str(temporary / "census-provider-policies"),
              "--packet-sha256", expected, "--output", str(temporary / "compiler-census-result")]
          pkg = temporary / "pkgconf-observation/LLVM_STATIC_INPUTS.json"
          argv += ["--pkgconf-observation", str(pkg), "--pkgconf-observation-sha256", hashlib.sha256(pkg.read_bytes()).hexdigest() if pkg.is_file() and not pkg.is_symlink() else "0" * 64]
          if os.environ["ATLAS_CENSUS_MODE"] == "execute":
              argv += ["--decision", str(temporary / "census-review-decision/DECISION.json"), "--decision-sha256", os.environ["ATLAS_CENSUS_DECISION_SHA256"]]
          sys.argv = argv
          runpy.run_path(str(root / "launch_api.py"), run_name="__main__")
          PYTHON

      - name: Stage positive compiler census evidence
        id: census_stage
        if: ${{ always() && steps.census.outcome != 'skipped' }}
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          expected = os.environ["ATLAS_CENSUS_PACKET_SHA256"]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Exact census source manifest required before import")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Physical census executable source required")
              body = path.read_bytes()
              if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"]:
                  raise SystemExit("Exact census executable source required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          argv = [str(root / "launch_api.py"), "stage", "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--policies", str(temporary / "census-provider-policies"),
              "--packet-sha256", expected, "--output", str(temporary / "compiler-census-public")]
          sys.argv = [*argv, "--source", str(temporary / "compiler-census-result")]
          runpy.run_path(str(root / "launch_api.py"), run_name="__main__")
          PYTHON

      - name: Preserve positive compiler API proof and diagnostic evidence
        if: ${{ always() && steps.census_stage.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grant-compiler-census-api
          path: ${{ runner.temp }}/compiler-census-public
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30

      - name: Retire transferred tools after exact API-only consumer return
        id: cleanup
        if: ${{ always() && steps.transfer_start.outcome == 'success' }}
        timeout-minutes: 2
        env:
          CENSUS_ATTEMPTED: ${{ steps.census.outcome != 'skipped' }}
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          expected = os.environ["ATLAS_CENSUS_PACKET_SHA256"]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Exact API-only manifest required before every import")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Physical API-only execution source required")
              body = path.read_bytes()
              if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"] or stat.S_IMODE(path.stat().st_mode) != row["mode"]:
                  raise SystemExit("Exact API-only execution bytes/modes required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          common = ["--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--policies", str(temporary / "census-provider-policies"), "--packet-sha256", expected]
          def delegate(operation, extra):
              sys.argv = [str(root / "launch_api.py"), operation, *common, *extra]
              try:
                  runpy.run_path(sys.argv[0], run_name="__main__")
              except SystemExit as status:
                  if type(status.code) is not int or status.code != 0:
                      raise
          pkg = temporary / "pkgconf-observation/LLVM_STATIC_INPUTS.json"
          common += ["--pkgconf-observation", str(pkg), "--pkgconf-observation-sha256", hashlib.sha256(pkg.read_bytes()).hexdigest() if pkg.is_file() and not pkg.is_symlink() else "0" * 64]
          if os.environ.get("CENSUS_ATTEMPTED") == "true":
              extra = ["--output", str(temporary / "unused-api-return"), "--source", str(temporary / "compiler-census-result")]
              if os.environ["ATLAS_CENSUS_MODE"] == "execute":
                  extra += ["--decision", str(temporary / "census-review-decision/DECISION.json"), "--decision-sha256", os.environ["ATLAS_CENSUS_DECISION_SHA256"]]
              delegate("return", extra)
          delegate("cleanup", ["--output", str(temporary / "census-cleanup-result")])
          PYTHON

      - name: Stage the exact original tool retirement receipt
        id: cleanup_stage
        if: ${{ always() && steps.cleanup.outcome == 'success' }}
        timeout-minutes: 1
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_compiler_census_api").resolve()
          raw = (root / "SOURCE_PINS.json").read_bytes()
          expected = os.environ["ATLAS_CENSUS_PACKET_SHA256"]
          if hashlib.sha256(raw).hexdigest() != expected:
              raise SystemExit("Exact API-only manifest required before every import")
          for row in json.loads(raw)["files"]:
              path = root / row["path"]
              if path.resolve(strict=True) != path or not stat.S_ISREG(path.lstat().st_mode):
                  raise SystemExit("Physical API-only execution source required")
              body = path.read_bytes()
              if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"] or stat.S_IMODE(path.stat().st_mode) != row["mode"]:
                  raise SystemExit("Exact API-only execution bytes/modes required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          common = ["--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--policies", str(temporary / "census-provider-policies"), "--packet-sha256", expected]
          def delegate(operation, extra):
              sys.argv = [str(root / "launch_api.py"), operation, *common, *extra]
              try:
                  runpy.run_path(sys.argv[0], run_name="__main__")
              except SystemExit as status:
                  if type(status.code) is not int or status.code != 0:
                      raise
          delegate("stage", ["--source", str(temporary / "census-cleanup-result"), "--output", str(temporary / "census-cleanup-public")])
          PYTHON

      - name: Preserve exact original transferred tool retirement
        if: ${{ always() && steps.cleanup_stage.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grant-census-tool-retirement
          path: ${{ runner.temp }}/census-cleanup-public
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30

      - name: Preserve exact same-job SDK evidence
        if: ${{ always() && steps.sdk.outcome != 'skipped' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: grant-native-provider-sdk
          path: ${{ runner.temp }}/grant-sdk-readiness
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 30
