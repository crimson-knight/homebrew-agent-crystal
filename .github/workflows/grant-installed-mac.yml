                  raise SystemExit("Exact provider source before imports required")
          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "launch.py"
          argv = [str(source), 'observe', "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--probe-packet", str(repo / "test/grant_native_buffer_probe"), "--feedback-packet", str(repo / "test/grant_native_buffer_source_feedback"),
