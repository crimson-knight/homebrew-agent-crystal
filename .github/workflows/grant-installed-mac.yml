          repo = pathlib.Path.cwd().resolve()
          temporary = pathlib.Path(os.environ["RUNNER_TEMP"])
          source = root / "launch.py"
          argv = [str(source), 'fetch', "--repository", str(repo), "--sdk-evidence", str(temporary / "grant-sdk-readiness"),
              "--transfer-packet", str(repo / "test/grant_dirty_transition"), "--tool-workspace", os.environ["TRANSFER_WORKSPACE"],
              "--probe-packet", str(repo / "test/grant_native_buffer_probe"), "--feedback-packet", str(repo / "test/grant_native_buffer_source_feedback"),
              "--packet-sha256", expected, "--python-sha256", hashlib.sha256(pathlib.Path(sys.executable).resolve().read_bytes()).hexdigest()]
          argv += ["--output", str(temporary / "native-review-decision"), "--decision-url", os.environ["ATLAS_PROVIDER_DECISION_URL"], "--decision-sha256", os.environ["ATLAS_PROVIDER_DECISION_SHA256"]]
          sys.argv = argv
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Materialize current same-job policies from reviewed stable inputs
        id: policies
        if: ${{ inputs.mode == 'resume' }}
        timeout-minutes: 2
        env:
          TRANSFER_WORKSPACE: ${{ steps.transfer_start.outputs.workspace }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import hashlib, json, os, pathlib, runpy, stat, sys
          root = pathlib.Path("test/grant_native_provider").resolve()
          pins = root / "SOURCE_PINS.json"
          expected = os.environ["ATLAS_PROVIDER_PACKET_SHA256"]
          if pins.is_symlink() or hashlib.sha256(pins.read_bytes()).hexdigest() != expected:
              raise SystemExit("Exact provider source manifest before imports required")
          for row in json.loads(pins.read_bytes())["files"]:
              path = root / row["path"]
              if not stat.S_ISREG(path.lstat().st_mode) or len(path.read_bytes()) != row["bytes"] or hashlib.sha256(path.read_bytes()).hexdigest() != row["sha256"]:
