          argv += ["--output", str(temporary / "native-buffer-source-feedback"), "--policies", str(temporary / "native-provider-policies")]
          sys.argv = argv
          runpy.run_path(str(source), run_name="__main__")
          PYTHON

      - name: Execute exact native original fixed restored ownership proof
        id: probe
        if: ${{ inputs.mode == 'resume' }}
        timeout-minutes: 15
        env:
