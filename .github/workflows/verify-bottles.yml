name: Verify bottles

# Installs the formula on main from its published bottles on macOS arm64, Linux
# arm64 and Linux x86_64, requires Homebrew to have poured each bottle (downloaded
# and checked against the sha256 in the formula), and runs the formula test.
# The Bottles workflow calls it after publishing; run it by hand any time:
#   gh workflow run verify-bottles.yml -R crimson-knight/homebrew-agent-crystal --ref main
#
# setup-homebrew checks out the commit that triggered the run, which for a call
# from Bottles predates the bottle block; the job therefore checks out the
# requested ref again before installing. --force-bottle makes a missing bottle
# fail the job instead of building from source.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions: {}

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  FORMULA: crimson-knight/agent-crystal/agent-crystal

jobs:
  verify:
    name: "${{ matrix.os }} pours the bottle"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04-arm
          - ubuntu-24.04
    steps:
      - name: Check out the published tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878

      # setup-homebrew moves the tap into the workspace and checks out the commit
      # that triggered the run. Called from the Bottles workflow, that commit
      # predates the bottle block, so this step puts the tap at the commit under test.
      - name: Put the tap at the commit under test
        env:
          COMMIT: ${{ inputs.ref || 'main' }}
        run: |
          git fetch --quiet origin "$COMMIT"
          git checkout --quiet --force -B main FETCH_HEAD
          TAP_HEAD="$(git -C "$(brew --repository crimson-knight/agent-crystal)" rev-parse HEAD)"
          echo "tap is at $TAP_HEAD"
          test "$TAP_HEAD" = "$(git rev-parse FETCH_HEAD)"

      - name: Register tap checkout
        run: |
          brew tap --custom-remote crimson-knight/agent-crystal "$PWD"
          brew trust --formula "$FORMULA"

      - name: Install from the bottle
        run: |
          brew install --force-bottle "$FORMULA"
          POURED=$(brew info --json=v2 "$FORMULA" | ruby -rjson -e 'puts JSON.parse(STDIN.read)["formulae"][0]["installed"][0]["poured_from_bottle"]')
          echo "poured_from_bottle=$POURED"
          test "$POURED" = "true"

      - name: Smoke test and formula test
        run: |
          acrystal --version
          test "$(crystal-alpha eval 'puts 40 + 2')" = "42"
          brew install pcre2 libyaml
          brew test "$FORMULA"
